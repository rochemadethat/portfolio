<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roche Sacks — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --text-light: #8e8e93;
      --border: #e5e5e7;
      --border-dark: #111111;
      --panel-bg: #ffffff;
      --accent: #000000;
      --chip-bg: #f2f2f7;
      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Top Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease;
      text-transform: lowercase;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text-main);
    }

    /* Hero Section */
    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem 2rem 2rem;
    }

    .hero-title-box {
      margin-bottom: 2rem;
    }

    .hero-title-box h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      font-weight: 400;
      max-width: 700px;
    }

    /* Embedded Widescreen Reel Frame */
    .reel-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d0d0d;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 3.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .reel-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .reel-controls-bar {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      z-index: 10;
    }

    .btn-small {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      font-family: inherit;
      transition: background 0.2s ease;
    }

    .btn-small:hover {
      background: #000;
    }

    /* Category Filter Tabs */
    .filter-bar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem 2rem 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-chip {
      background: var(--chip-bg);
      border: 1px solid transparent;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip:hover {
      color: var(--text-main);
      background: #e8e8ed;
    }

    .filter-chip.active {
      background: var(--text-main);
      color: #ffffff;
    }

    /* Masonry Grid Layout */
    .portfolio-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem 5rem 2rem;
      column-count: 3;
      column-gap: 2rem;
    }

    @media (max-width: 1024px) {
      .portfolio-grid { column-count: 2; }
    }

    @media (max-width: 640px) {
      .portfolio-grid { column-count: 1; }
      header, .hero, .filter-bar, .portfolio-grid { padding-left: 1.25rem; padding-right: 1.25rem; }
    }

    .project-card {
      break-inside: avoid;
      margin-bottom: 2.5rem;
      cursor: pointer;
      group: relative;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      background: #f0f0f2;
    }

    .thumbnail-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s var(--transition-smooth);
    }

    .project-card:hover .thumbnail-wrapper img {
      transform: scale(1.02);
    }

    .edit-thumb-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0,0,0,0.7);
      color: #ffffff;
      border: none;
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-family: inherit;
    }

    .project-card:hover .edit-thumb-btn {
      opacity: 1;
    }

    .project-info {
      padding-top: 0.85rem;
    }

    .project-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .project-meta {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project-roles {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      margin-top: 0.35rem;
      font-weight: 500;
    }

    /* Side-Sliding Panel Modal */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .panel-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 620px;
      height: 100%;
      background: var(--panel-bg);
      z-index: 201;
      box-shadow: -10px 0 30px rgba(0,0,0,0.1);
      transform: translateX(100%);
      transition: transform 0.4s var(--transition-smooth);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 2.5rem;
    }

    .panel-overlay.active .side-panel {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .close-btn {
      background: var(--chip-bg);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background 0.2s ease;
    }

    .close-btn:hover {
      background: #e0e0e5;
    }

    .panel-content h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .panel-roles-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .panel-media-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .panel-media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .panel-body-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .panel-external-link {
      display: inline-block;
      background: var(--text-main);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .panel-external-link:hover {
      opacity: 0.85;
    }

    /* Edit Dialog Modal */
    .dialog-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      z-index: 300;
      width: 90%;
      max-width: 450px;
      display: none;
    }

    .dialog-box.active {
      display: block;
    }

    .dialog-box h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .dialog-box input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      margin-bottom: 1rem;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <a href="#" class="brand-name">Roche Sacks</a>
    <nav class="nav-links">
      <button class="nav-btn" onclick="openAboutPanel()">[about]</button>
      <button class="nav-btn" onclick="openContactPanel()">[contact]</button>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-title-box">
      <h1>ROCHE SACKS</h1>
      <p class="hero-subtitle">Video Producer, Editor, Sound Designer & Creative Strategist</p>
    </div>

    <!-- Widescreen Embedded Reel -->
    <div class="reel-container">
      <iframe id="heroReelIframe" src="https://player.vimeo.com/video/76979871?autoplay=0&loop=1&autopause=0" allow="autoplay; fullscreen"></iframe>
      <div class="reel-controls-bar">
        <button class="btn-small" onclick="promptEditReel()">[Edit Reel URL]</button>
      </div>
    </div>
  </section>

  <!-- Category Filter Bar -->
  <div class="filter-bar">
    <button class="filter-chip active" onclick="filterCategory('all', this)">All Projects</button>
    <button class="filter-chip" onclick="filterCategory('short-form', this)">Short Form / Reels</button>
    <button class="filter-chip" onclick="filterCategory('long-form', this)">Longform / YouTube</button>
    <button class="filter-chip" onclick="filterCategory('influencer', this)">Influencer Collabs</button>
    <button class="filter-chip" onclick="filterCategory('photography', this)">Photography</button>
  </div>

  <!-- Masonry Portfolio Grid -->
  <main class="portfolio-grid" id="portfolioGrid">
    <!-- Cards rendered dynamically via JS -->
  </main>

  <!-- Side Sliding Panel Modal -->
  <div class="panel-overlay" id="panelOverlay" onclick="closePanelOnOverlay(event)">
    <div class="side-panel" id="sidePanel">
      <div class="panel-header">
        <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light);" id="panelCategoryTag">Project</span>
        <button class="close-btn" onclick="closeSidePanel()">&times;</button>
      </div>
      <div class="panel-content" id="panelContent">
        <!-- Content inserted dynamically -->
      </div>
    </div>
  </div>

  <!-- Thumbnail Swapper Dialog Modal -->
  <div class="dialog-box" id="dialogBox">
    <h3>Swap GIF / Thumbnail URL</h3>
    <input type="text" id="thumbUrlInput" placeholder="Paste image or GIF link (e.g. https://.../image.gif)">
    <div class="dialog-actions">
      <button class="btn-small" style="background:#ccc; color:#000;" onclick="closeDialog()">Cancel</button>
      <button class="btn-small" onclick="saveNewThumbnail()">Save</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div>ROCHE SACKS 2026 ©</div>
    <div>
      <a href="mailto:booking@lovekaroche.com">booking@lovekaroche.com</a> | 
      <a href="https://instagram.com/lovelarocheshoots" target="_blank">@lovelarocheshoots</a>
    </div>
  </footer>

  <script>
    // Project Database
    const projectsData = [
      {
        id: "r29-now-you-see-me",
        title: "Now You See Me Now You Don't",
        client: "Refinery29",
        category: "short-form",
        roles: "Video Editor",
        thumb: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/refinery29/reel/DQ-PF6-Ce0J/",
        type: "instagram",
        description: "Social edit for Refinery29 covering the movie premiere."
      },
      {
        id: "r29-winter-lookbook",
        title: "R29 Winter Look Book Series",
        client: "Refinery29",
        category: "short-form",
        roles: "Colorist",
        thumb: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/refinery29/reel/DSGVNa3iWJT/",
        type: "instagram",
        description: "Color grading for Refinery29 winter editorial lookbook."
      },
      {
        id: "titaniumdice-holy-trinity",
        title: "Roland Holy Trinity",
        client: "@titaniumdice",
        category: "influencer",
        roles: "Video Editor",
        thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/nite.skooled/reel/DRVGcMjAc9G/",
        type: "instagram",
        description: "Dynamic TikTok/IG edit for synthesizer collaboration."
      },
      {
        id: "yamaha-r1m",
        title: "Yamaha R1M Feature",
        client: "@r1m_yatty",
        category: "influencer",
        roles: "Video Producer | Videographer | Editor | Colorist",
        thumb: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/r1m_yatty/",
        type: "instagram",
        description: "Full-service video showcase for high-performance automotive content."
      },
      {
        id: "stefdagz-tbd",
        title: "To Be Determined Series",
        client: "w/ @stefdagz",
        category: "long-form",
        roles: "Sound Designer | Sound Mixer",
        thumb: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.youtube.com/embed/ORLp_nmlkA0",
        type: "youtube",
        description: "Custom sound design and mixing for YouTube series collaboration."
      },
      {
        id: "photo-digitals",
        title: "Model Comp Cards & Digitals",
        client: "Editorial",
        category: "photography",
        roles: "Photographer",
        thumb: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/p/DZfsv0TGrnP/",
        type: "instagram",
        description: "High-fashion model digital portraits and editorial studio comps."
      },
      {
        id: "photo-commercial",
        title: "Commercial Photography Feature",
        client: "Brand Campaign",
        category: "photography",
        roles: "Photographer | Creative Director",
        thumb: "https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=800&q=80",
        videoEmbed: "https://www.instagram.com/p/DePnbdTj5wv/",
        type: "instagram",
        description: "Commercial brand photography and lifestyle imagery."
      }
    ];

    let currentEditingId = null;

    // Load persisted thumbnails from localStorage
    function getStoredThumbnails() {
      const stored = localStorage.getItem('roche_portfolio_thumbs');
      return stored ? JSON.parse(stored) : {};
    }

    function saveStoredThumbnail(id, url) {
      const stored = getStoredThumbnails();
      stored[id] = url;
      localStorage.setItem('roche_portfolio_thumbs', JSON.stringify(stored));
    }

    // Render Grid
    function renderGrid(filter = 'all') {
      const grid = document.getElementById('portfolioGrid');
      grid.innerHTML = '';

      const customThumbs = getStoredThumbnails();

      projectsData.forEach(proj => {
        if (filter !== 'all' && proj.category !== filter) return;

        const thumbSrc = customThumbs[proj.id] || proj.thumb;

        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `
          <div class="thumbnail-wrapper" onclick="openProjectPanel('${proj.id}')">
            <img src="${thumbSrc}" alt="${proj.title}" loading="lazy">
            <button class="edit-thumb-btn" onclick="event.stopPropagation(); openEditDialog('${proj.id}')">[EDIT GIF/THUMBNAIL]</button>
          </div>
          <div class="project-info" onclick="openProjectPanel('${proj.id}')">
            <div class="project-title">${proj.title}</div>
            <div class="project-meta">
              <span>${proj.client}</span>
            </div>
            <div class="project-roles">${proj.roles}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Category Filter Handler
    function filterCategory(cat, btn) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(cat);
    }

    // Side Panel Handler
    function openProjectPanel(id) {
      const proj = projectsData.find(p => p.id === id);
      if (!proj) return;

      document.getElementById('panelCategoryTag').innerText = proj.category.replace('-', ' ');

      let mediaHTML = '';
      if (proj.type === 'youtube') {
        mediaHTML = `
          <div class="panel-media-container">
            <iframe src="${proj.videoEmbed}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        `;
      } else {
        mediaHTML = `
          <div class="panel-media-container" style="display:flex; align-items:center; justify-content:center; background:#f4f4f6; color:#555; text-align:center; padding:1.5rem;">
            <div>
              <p style="margin-bottom:1rem; font-weight:500;">View this post directly on Instagram</p>
              <a href="${proj.videoEmbed}" target="_blank" class="panel-external-link">Open Instagram Link ↗</a>
            </div>
          </div>
        `;
      }

      document.getElementById('panelContent').innerHTML = `
        <h2>${proj.title}</h2>
        <div class="panel-roles-tag">${proj.roles}</div>
        ${mediaHTML}
        <div class="panel-body-text">${proj.description}</div>
      `;

      document.getElementById('panelOverlay').classList.add('active');
    }

    function openAboutPanel() {
      document.getElementById('panelCategoryTag').innerText = 'About';
      document.getElementById('panelContent').innerHTML = `
        <h2>ROCHELLE (ROCHE) SACKS</h2>
        <div class="panel-roles-tag">Video Producer • Editor • Creative Director</div>
        <div class="panel-body-text">
          <p style="margin-bottom:1rem;">Hi! I’m Rochelle. As a seasoned video producer and editor, I’ve spent the past twelve years helping commercial, government and influencer brands develop digital storytelling that helps bolster their social media presence, elevate meaningful audience engagement and grow their impact online.</p>
          <p style="margin-bottom:1rem;">With experience creating platform-specific long and short video products for large clients (U.S Department of State, Refinery29, influencers), I thrive both as a full-service video producer/editor, project manager, content creator, and communications strategist.</p>
          <p style="margin-bottom:1rem;">I also bring over ten years of experience working as a photographer, sound mixer/designer, international runway model and musician. Growing up overseas in Vietnam, Korea, and Panama, my international background empowers me to intersect my global and creative interests as a digital storyteller. My work is informed by the connections made with my subjects on a human level, understanding that behind every video are real stories waiting to be told.</p>
        </div>
        <div style="margin-top:2rem;">
          <a href="mailto:booking@lovekaroche.com" class="panel-external-link">Contact Roche</a>
        </div>
      `;
      document.getElementById('panelOverlay').classList.add('active');
    }

    function openContactPanel() {
      document.getElementById('panelCategoryTag').innerText = 'Contact';
      document.getElementById('panelContent').innerHTML = `
        <h2>GET IN TOUCH</h2>
        <div class="panel-roles-tag">Inquiries & Booking</div>
        <div class="panel-body-text">
          <p style="margin-bottom:1.5rem;">For commercial inquiries, video editing bookings, or creative collaborations:</p>
          <p style="font-size:1.1rem; font-weight:600; color:var(--text-main); margin-bottom:0.5rem;">Email:</p>
          <p style="margin-bottom:1.5rem;"><a href="mailto:booking@lovekaroche.com" style="color:var(--text-main);">booking@lovekaroche.com</a></p>
          <p style="font-size:1.1rem; font-weight:600; color:var(--text-main); margin-bottom:0.5rem;">Instagram:</p>
          <p style="margin-bottom:1.5rem;"><a href="https://instagram.com/lovelarocheshoots" target="_blank" style="color:var(--text-main);">@lovelarocheshoots</a></p>
        </div>
      `;
      document.getElementById('panelOverlay').classList.add('active');
    }

    function closeSidePanel() {
      document.getElementById('panelOverlay').classList.remove('active');
    }

    function closePanelOnOverlay(e) {
      if (e.target.id === 'panelOverlay') {
        closeSidePanel();
      }
    }

    // Dynamic Edit Dialog
    function openEditDialog(id) {
      currentEditingId = id;
      const customThumbs = getStoredThumbnails();
      const proj = projectsData.find(p => p.id === id);
      document.getElementById('thumbUrlInput').value = customThumbs[id] || proj.thumb;
      document.getElementById('dialogBox').classList.add('active');
    }

    function closeDialog() {
      document.getElementById('dialogBox').classList.remove('active');
      currentEditingId = null;
    }

    function saveNewThumbnail() {
      const url = document.getElementById('thumbUrlInput').value.trim();
      if (url && currentEditingId) {
        saveStoredThumbnail(currentEditingId, url);
        renderGrid();
      }
      closeDialog();
    }

    function promptEditReel() {
      const newUrl = prompt("Paste your new Vimeo or YouTube video embed URL:", "https://player.vimeo.com/video/76979871");
      if (newUrl) {
        document.getElementById('heroReelIframe').src = newUrl;
      }
    }

    // Init
    renderGrid();
  </script>
</body>
</html>
